<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสถานะ - ระบบแจ้งซ่อม BEN2</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .table-container { padding: 1rem; margin-top: 1rem; }
        th, td { padding: 1rem; }
        th { white-space: nowrap; }
        td { vertical-align: top; }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="container animate-fade">
        <nav style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0;">
            <div class="logo" style="font-weight: bold; font-size: 1.2rem;">
                <a href="index.html" style="color: inherit; text-decoration: none;">
                    <i class="fas fa-tools" style="color: var(--accent, #FFD700);"></i> BEN2 Maintenance
                </a>
            </div>
            <div>
                <a href="admin.html" class="btn btn-outline" style="text-decoration: none; padding: 0.5rem 1rem; font-size: 0.9rem;">
                    <i class="fas fa-user-cog"></i> เข้าสู่ระบบช่าง (Admin)
                </a>
            </div>
        </nav>

        <header style="padding: 2rem 0 1rem 0; text-align: left;">
            <h2 style="display: flex; justify-content: space-between; align-items: center; margin: 0;">
                <span><i class="fas fa-clipboard-list" style="color: var(--accent, #FFD700);"></i> รายการแจ้งซ่อมทั้งหมด</span>
                <button onclick="loadDashboard()" class="btn btn-outline" style="padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-sync-alt"></i> รีเฟรชข้อมูล
                </button>
            </h2>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>รหัสซ่อม</th>
                        <th>อุปกรณ์ (สถานที่)</th>
                        <th>ผู้แจ้ง</th>
                        <th>สถานะ</th>
                        <th>รูปภาพ</th>
                    </tr>
                </thead>
                <tbody id="ticketTableBody">
                    <tr><td colspan="5" style="text-align:center; padding: 2rem;">กำลังโหลดข้อมูล... <i class="fas fa-spinner fa-spin"></i></td></tr>
                </tbody>
            </table>
        </div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <a href="index.html" class="btn btn-primary" style="text-decoration: none;">
                <i class="fas fa-plus"></i> กลับไปหน้าแจ้งซ่อม
            </a>
        </div>

        <footer style="text-align:center; margin-top:4rem; padding: 2rem 0; border-top: 1px solid rgba(255,255,255,0.05); color: #ccc; font-size:0.85rem; line-height: 1.6; padding-bottom: 3rem;">
            <div>© 2026 BEN2 Maintenance System | ระบบแจ้งซ่อมอุปกรณ์สื่อ</div>
            
            <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--line); display: inline-block;">
                <div style="color: #FFD700; font-weight: bold; font-size: 0.95rem; margin-bottom: 0.3rem;">
                    <i class="fas fa-laptop-code"></i> พัฒนาระบบโดย: นายวีระภัทร อ่วมเกษม
                </div>
                <div style="font-size: 0.8rem; color: #999;">
                    <i class="fas fa-user-graduate"></i> นักศึกษาเทคโนโลยีคอมพิวเตอร์ KMITL ชั้นปีที่ 2
                </div>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
