<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งซ่อมและติดตามสถานะ - BEN2</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="container animate-fade">
        <nav>
            <div class="logo">
                <a href="index.html" style="text-decoration:none; color:inherit;"><i class="fas fa-tools"></i> BEN2 Maintenance</a>
            </div>
            <div id="user-section" style="display:none;" class="user-profile">
                <span id="user-name"></span>
                <img id="user-avatar" class="profile-img">
                <button id="logout-btn" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.8rem;">ออกจากระบบ</button>
            </div>
            <button id="auth-btn" class="btn btn-primary" style="display:none;">
                <i class="fab fa-google"></i> เข้าสู่ระบบด้วย Google
            </button>
        </nav>

        <section class="private-content" style="display:none;">
            <div class="grid grid-cols-2">
                <!-- Form Section -->
                <div class="card">
                    <h2 style="margin-bottom:1.5rem; color:var(--accent)"><i class="fas fa-plus-circle"></i> แจ้งซ่อมใหม่</h2>
                    <form id="ticket-form">
                        <div class="form-group">
                            <label><i class="fas fa-tv"></i> ประเภทอุปกรณ์</label>
                            <input type="text" id="equipment-type" placeholder="เช่น ทีวี, ลำโพง, โปรเจคเตอร์" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-map-marker-alt"></i> สถานที่/ห้อง</label>
                            <input type="text" id="location" placeholder="เช่น อาคาร 1 ห้อง 114" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-exclamation-triangle"></i> รายละเอียดอาการชำรุด</label>
                            <textarea id="issue-detail" rows="4" placeholder="ระบุอาการชำรุดที่พบโดยละเอียด" required></textarea>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-camera"></i> แนบรูปภาพประกอบ (ถ้ามี)</label>
                            <input type="file" id="image-file" accept="image/*" style="border: 1px dashed rgba(212,175,55,0.3); padding: 1.5rem; cursor: pointer;">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%; padding:1rem;" id="submit-btn">
                            <i class="fas fa-paper-plane"></i> ส่งรายงานแจ้งซ่อม
                        </button>
                    </form>
                </div>

                <!-- Stats/Instructions Section -->
                <div>
                    <div id="list" style="margin-top:0;">
                        <h2 style="margin-bottom:1.5rem; color:var(--accent)"><i class="fas fa-clipboard-list"></i> รายการแจ้งซ่อมทางโรงเรียน</h2>
                        <div id="tickets-list" class="grid" style="gap:1rem; max-height: 800px; overflow-y: auto; padding-right: 0.5rem;">
                            <!-- Tickets populated by app.js -->
                            <div class="card" style="text-align:center; color:var(--text-muted)">กำลังโหลดข้อความ...</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="public-content" style="text-align:center; padding: 4rem 0;">
            <i class="fas fa-lock" style="font-size:3rem; color:var(--accent); margin-bottom:1rem;"></i>
            <h2>กรุณาเข้าสู่ระบบ</h2>
            <p style="color:var(--text-muted); margin-bottom:2rem;">โปรดใช้อีเมล @gmail.com เพื่อดเข้าสู่ระบบแจ้งซ่อม</p>
            <button onclick="document.getElementById('auth-btn').click()" class="btn btn-primary">เข้าสู่ระบบด้วย Google</button>
        </section>

        <footer style="text-align:center; margin-top:6rem; padding: 2rem 0; border-top: 1px solid rgba(255,255,255,0.05); color:var(--text-muted); font-size:0.8rem;">
            © 2026 BEN2 Maintenance System
        </footer>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center;">
        <div class="card animate-fade" style="max-width:400px; text-align:center;">
            <i class="fas fa-check-circle" style="font-size:3rem; color:var(--success); margin-bottom:1rem;"></i>
            <h2>ส่งรายงานสำเร็จ!</h2>
            <p style="color:var(--text-muted); margin-bottom:2rem;">ช่างจะรีบดำเนินการตรวจสอบให้เร็วที่สุด</p>
            <button onclick="document.getElementById('success-modal').style.display='none'" class="btn btn-outline" style="width:100%">ตกลง</button>
        </div>
    </div>

    <script type="module">
        import { submitTicket } from './app.js';
        
        const form = document.getElementById('ticket-form');
        const submitBtn = document.getElementById('submit-btn');
        const successModal = document.getElementById('success-modal');

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังส่งข้อมูล...';

            const ticketData = {
                equipment_type: document.getElementById('equipment-type').value,
                location: document.getElementById('location').value,
                issue_detail: document.getElementById('issue-detail').value
            };
            const imageFile = document.getElementById('image-file').files[0];

            const success = await submitTicket(ticketData, imageFile);
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่งรายงานแจ้งซ่อม';

            if (success) {
                form.reset();
                successModal.style.display = 'flex';
            } else {
                alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
            }
        };
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
