<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการของช่าง - BEN2</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .table-container { padding: 1rem; margin-top: 1rem; }
        th, td { padding: 1rem; }
        th { white-space: nowrap; }
        td { vertical-align: top; }
    </style>
</head>

<body>
    <div id="site-header"></div>
    <div class="container animate-fade" style="max-width: 1000px;">
        <header style="padding: 2rem 0 1rem 0;">
            <h2 style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;"><span><i class="fas fa-chart-line"></i> แดชบอร์ดสรุปข้อมูล</span>
                <a href="index.html" id="logoutBtn" class="btn btn-outline" style="padding:0.5rem 1rem; font-size:0.9rem;"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</a></h2>
        </header>

        <!-- แผนภาพสรุปข้อมูล -->
        <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
            <div class="card" style="text-align: center; padding: 1.5rem;">
                <h3 id="statTotal" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem;">0</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;"><i class="fas fa-ticket-alt"></i> งานทั้งหมด</p>
            </div>
            <div class="card" style="text-align: center; padding: 1.5rem;">
                <h3 id="statPending" style="font-size: 2.5rem; color: #ff6b6b; margin-bottom: 0.5rem;">0</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;"><i class="fas fa-clock"></i> รอรับเรื่อง</p>
            </div>
            <div class="card" style="text-align: center; padding: 1.5rem;">
                <h3 id="statProgress" style="font-size: 2.5rem; color: #feca57; margin-bottom: 0.5rem;">0</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;"><i class="fas fa-spinner fa-spin"></i> กำลังดำเนินการ</p>
            </div>
            <div class="card" style="text-align: center; padding: 1.5rem;">
                <h3 id="statDone" style="font-size: 2.5rem; color: #1dd1a1; margin-bottom: 0.5rem;">0</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;"><i class="fas fa-check-circle"></i> เสร็จสิ้น</p>
            </div>
        </section>

        <header style="padding: 1rem 0 1rem 0;">
            <h2><i class="fas fa-tasks"></i> จัดการรายการแจ้งซ่อม</h2>
        </header>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>รหัสซ่อม / ผู้แจ้ง</th>
                        <th>อาการ / สถานที่</th>
                        <th>รูปภาพ</th>
                        <th>ปรับสถานะ</th>
                        <th>ข้อความถึงผู้แจ้ง (ระบุเหตุผล/นัดหมาย)</th>
                        <th>บันทึก</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr>
                        <td colspan="6" style="text-align:center;">กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="site-footer"></div>

    <script src="layout.js"></script>
    <script src="app.js"></script>
</body>

</html>
