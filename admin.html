<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการของช่าง - BEN2</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .table-container {
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            text-align: left;
        }

        th {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            color: var(--accent, #FFD700);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        select,
        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            border-radius: 5px;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="container animate-fade" style="max-width: 1000px;">
        <nav style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0;">
            <div class="logo"><i class="fas fa-tools" style="color: #FFD700;"></i> โหมดช่างซ่อม (Admin)</div>
            <a href="index.html" class="btn btn-outline" style="text-decoration: none;"><i
                    class="fas fa-sign-out-alt"></i> ออกจากระบบ</a>
        </nav>
        <header style="padding: 2rem 0 1rem 0;">
            <h2><i class="fas fa-tasks"></i> จัดการรายการแจ้งซ่อม</h2>
        </header>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>รหัสซ่อม / ผู้แจ้ง</th>
                        <th>อาการ / สถานที่</th>
                        <th>ปรับสถานะ</th>
                        <th>ข้อความถึงผู้แจ้ง (ระบุเหตุผล/นัดหมาย)</th>
                        <th>บันทึก</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center;">กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
